<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1520" />
      <stop offset="50%" stop-color="#111c2e" />
      <stop offset="100%" stop-color="#080c10" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8f36b" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="300" height="300" rx="150" fill="url(#bgGrad)" />
  <circle cx="150" cy="150" r="147" fill="none" stroke="url(#accentGrad)" stroke-width="3" opacity="0.6" />
  
  <!-- Geometric Grid & Circuit Accents -->
  <circle cx="150" cy="150" r="120" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 8" opacity="0.3" />
  <circle cx="150" cy="150" r="95" fill="none" stroke="#d8f36b" stroke-width="1" stroke-dasharray="2 6" opacity="0.25" />
  
  <!-- Stylized Tech Silhouette / Monogram Avatar -->
  <g transform="translate(150, 140)">
    <!-- Head / Silhouette -->
    <circle cx="0" cy="-35" r="32" fill="#1e293b" stroke="#38bdf8" stroke-width="2" opacity="0.9" />
    <!-- Shoulders -->
    <path d="M-55,48 C-55,10 -30,0 0,0 C30,0 55,10 55,48 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="2" opacity="0.9" />
    <!-- Monogram Over Silhouette -->
    <text x="0" y="-25" text-anchor="middle" font-family="'Manrope', sans-serif" font-weight="800" font-size="28" fill="#d8f36b" letter-spacing="2">AF</text>
    <text x="0" y="28" text-anchor="middle" font-family="'DM Mono', monospace" font-size="10" fill="#94a3b8" letter-spacing="3">DEV // DJSCE</text>
  </g>
  
  <!-- Crosshairs & Coordinate points -->
  <path d="M150,15 L150,30 M150,270 L150,285 M15,150 L30,150 M270,150 L285,150" stroke="#d8f36b" stroke-width="1.5" opacity="0.7" />
  <circle cx="150" cy="150" r="140" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
</svg>
